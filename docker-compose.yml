# Локальная разработка. На проде backend/bot идут как отдельные сервисы
# в общей сети Botyard, PostgreSQL/Redis — общие для платформы (см. §3 PROJECT_CONTEXT).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: "host"
    # Слушаем только петлю: наружу ходят через Caddy (reverse_proxy 127.0.0.1:3015).
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "3015"]
    env_file: .env

  bot:
    build:
      context: ./bot
    network_mode: "host"
    env_file: .env
